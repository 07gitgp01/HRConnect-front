<div class="post-detail-container">
  <div *ngIf="loading" class="loading">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Chargement de l'article...</p>
  </div>

  <div *ngIf="error && !loading" class="error">
    <mat-icon>error_outline</mat-icon>
    <h2>Article non trouvé</h2>
    <p>L'actualité que vous recherchez n'existe pas ou a été supprimée.</p>
    <button mat-raised-button color="primary" routerLink="/actualites">
      Voir toutes les actualités
    </button>
  </div>

  <article *ngIf="!loading && !error && post" class="post-article">
    <div class="post-header">
      <h1>{{ post.title }}</h1>
      <div class="post-meta">
        <mat-icon>event</mat-icon>
        <span>{{ post.createdAt | date:'dd/MM/yyyy à HH:mm' }}</span>
        <span *ngIf="post.updatedAt && post.updatedAt !== post.createdAt" class="updated">
          (mis à jour le {{ post.updatedAt | date:'dd/MM/yyyy' }})
        </span>
      </div>
    </div>

    <!-- Affichage des deux médias : image ET vidéo (si présents) -->
    <div class="post-media" *ngIf="post.imageUrl || post.videoUrl">
      <img *ngIf="post.imageUrl" [src]="post.imageUrl" [alt]="post.title">
      <video *ngIf="post.videoUrl" controls [src]="post.videoUrl"></video>
    </div>

    <div class="post-content" [innerHTML]="safeContent"></div>

    <div class="post-footer">
      <button mat-stroked-button color="primary" routerLink="/actualites">
        <mat-icon>arrow_back</mat-icon> Retour aux actualités
      </button>
    </div>
  </article>
</div>
